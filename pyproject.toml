[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vinospeak"
version = "0.3.0"
description = "Intel NPU-powered Kokoro text-to-speech with OpenVINO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karan Shukla" }]
keywords = ["kokoro", "openvino", "npu", "text-to-speech", "tts", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
# openvino 2026.4.1 has no cp315 wheels; without the cap uv picks 3.15 and fails
requires-python = ">=3.11,<3.15"
# OpenVINO is pinned to the exact release the other vino apps use (vinoPop's
# requirements-ai.txt, vinoWhisper's uv.lock): two programs on one NPU must not
# run different OpenVINO releases. Bump it in step with them; `ovfetch detect`
# reports the range your NPU driver is known to work with.
dependencies = [
    "espeakng-loader>=0.2.4",
    "huggingface-hub>=0.24.0",
    "numpy>=1.24.0",
    "openvino==2026.4.1",
    "openvino-genai==2026.4.1.0",
    "soundfile>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/karanshukla/vinoSpeak"
Repository = "https://github.com/karanshukla/vinoSpeak"
Issues = "https://github.com/karanshukla/vinoSpeak/issues"
Changelog = "https://github.com/karanshukla/vinoSpeak/blob/main/CHANGELOG.md"

[project.scripts]
vinospeak = "vino_speak.cli:main"
vinospeak-doctor = "vino_speak.doctor:main"

[tool.setuptools.packages.find]
include = ["vino_speak*"]

# Dropping either from the wheel fails quietly: the pins are read at run time.
[tool.setuptools.package-data]
vino_speak = ["model_pins.json", "py.typed"]

# ── uv ────────────────────────────────────────────────────────────────────────

[dependency-groups]
# Installable alone, so CI never downloads OpenVINO
dev = [
    # The tests build waveforms with it; everything else of the runtime is faked
    "numpy>=1.24.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "poethepoet>=0.27",
    "bump-my-version>=0.24",
]

# ── bump-my-version ───────────────────────────────────────────────────────────

[tool.bumpversion]
current_version = "0.3.0"
commit = true
tag = true
tag_name = "v{new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tool.poe.tasks]
lint  = "ruff check ."
fmt   = "ruff format --check ."
types = "mypy"
test  = "pytest -v --tb=short"
fix.sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]
security.cmd = "uvx --from bandit[toml]==1.9.4 bandit -c pyproject.toml -r ."
security.help = "the same Bandit scan the Bandit workflow runs"
check.sequence = ["lint", "fmt", "types", "test"]
check.help = "everything CI runs, locally"
doctor = "vinospeak-doctor"

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501", # line length is the formatter's job
]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
files = ["vino_speak", "scripts"]
ignore_missing_imports = true
strict = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["vino_speak"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

# ── Bandit ────────────────────────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", "build", "dist"]
skips = [
    "B404", # import subprocess: ovfetch is run by design
    "B603", # subprocess without shell
]
