[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vinospeak"
version = "0.1.0"
description = "Intel NPU-powered Kokoro text-to-speech with OpenVINO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karan Shukla" }]
requires-python = ">=3.11"
# OpenVINO is pinned to the exact release the other vino apps use (vinoPop's
# requirements-ai.txt, vinoWhisper's uv.lock): two programs on one NPU must not
# run different OpenVINO releases. Bump it in step with them; `ovfetch detect`
# reports the range your NPU driver is known to work with.
dependencies = [
    "espeakng-loader>=0.2.4",
    "huggingface-hub>=0.24.0",
    "numpy>=1.24.0",
    "openvino==2026.4.1",
    "openvino-genai==2026.4.1.0",
    "soundfile>=0.12.1",
]

[project.scripts]
vinospeak = "vino_speak.cli:main"
vinospeak-doctor = "vino_speak.doctor:main"

[tool.setuptools.packages.find]
include = ["vino_speak*"]

# Dropping either from the wheel fails quietly: the pins are read at run time.
[tool.setuptools.package-data]
vino_speak = ["model_pins.json", "py.typed"]

# ── uv ────────────────────────────────────────────────────────────────────────

[dependency-groups]
# Installable alone, so CI never downloads OpenVINO
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "poethepoet>=0.27",
]

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tool.poe.tasks]
lint  = "ruff check ."
fmt   = "ruff format --check ."
types = "mypy"
test  = "pytest -v --tb=short"
fix.sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]
security.cmd = "uvx --from bandit[toml]==1.9.4 bandit -c pyproject.toml -r ."
security.help = "the same Bandit scan the Bandit workflow runs"
check.sequence = ["lint", "fmt", "types", "test"]
check.help = "everything CI runs, locally"
doctor = "vinospeak-doctor"

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501", # line length is the formatter's job
]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
files = ["vino_speak", "scripts"]
ignore_missing_imports = true
strict = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.report]
show_missing = true

# ── Bandit ────────────────────────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", "build", "dist"]
skips = [
    "B404", # import subprocess: ovfetch is run by design
    "B603", # subprocess without shell
]
