name: Release

# Runs on the tag bump-my-version creates (CONTRIBUTING.md). Same shape as
# vinoWhisper's release, without the desktop binaries.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag v${VERSION} does not match pyproject.toml version ${declared}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel carries the model pins
        # Read at run time, so a wheel without them installs fine and then fails
        run: |
          for file in model_pins.json py.typed; do
            if ! unzip -l dist/*.whl | grep -q "vino_speak/$file"; then
              echo "::error::the wheel has no vino_speak/$file"
              exit 1
            fi
          done

      - name: Check the metadata renders on PyPI
        # A rejected upload cannot be retried under the same version
        run: uvx twine@7.0.0 check --strict dist/*

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHANGELOG.md is hand-edited, so it is the source of release prose
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1              { found = 1; next }
            found && index($0, "## [") == 1  { exit }
            found                            { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            exit 1
          fi
          {
            echo
            echo '## Install'
            echo
            echo '```'
            echo "uv tool install vinospeak==${VERSION}"
            echo '```'
          } >> RELEASE_NOTES.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            RELEASE_NOTES.md

  pypi:
    needs: build
    # Belt and braces: only a pushed v* tag may publish, whatever triggers are added later.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Named in PyPI's Trusted Publishing config; renaming it breaks uploads
    environment:
      name: pypi
      url: https://pypi.org/p/vinospeak
    permissions:
      id-token: write # OIDC for Trusted Publishing. No API token anywhere.
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      # Before the GitHub Release: a PyPI version can never be re-uploaded
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so gh cannot infer the repo
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
