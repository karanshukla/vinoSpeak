name: Release

# Runs on the tag bump-my-version creates (CONTRIBUTING.md). Same shape as
# vinoWhisper's release: the wheel goes to PyPI; the GitHub release also gets
# the window (glibc, built on 22.04) and install.sh, the one-line installer.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # The tag's commit passed CI on main, but the release runs at the same
  # moment (bump-my-version pushes both), so it checks again before publishing.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  gui:
    # glibc, since winit dlopens libwayland and libEGL. Built on the oldest
    # runner, so it runs wherever glibc is at least 2.35.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the window's version matches the tag
        run: |
          declared=$(grep -m1 '^version = ' gui/Cargo.toml | cut -d'"' -f2)
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match gui/Cargo.toml version $declared"
            exit 1
          fi
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked --manifest-path gui/Cargo.toml
      # The tarball install.sh unpacks: the binary, its app menu entry and icon.
      - name: Package
        run: |
          dir=vinospeak-gui
          mkdir "$dir"
          cp gui/target/release/vinospeak-gui gui/data/dev.vinospeak.Listen.desktop "$dir/"
          cp docs/assets/vinospeak.svg "$dir/dev.vinospeak.Listen.svg"
          if ldd "$dir/vinospeak-gui" | grep 'not found'; then exit 1; fi
          tar czf vinospeak-gui-x86_64-linux.tar.gz "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui
          path: vinospeak-gui-x86_64-linux.tar.gz

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag v${VERSION} does not match pyproject.toml version ${declared}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel carries the model pins
        # Read at run time, so a wheel without them installs fine and then fails
        run: |
          for file in model_pins.json py.typed; do
            if ! unzip -l dist/*.whl | grep -q "vino_speak/$file"; then
              echo "::error::the wheel has no vino_speak/$file"
              exit 1
            fi
          done

      - name: Install the wheel and run it
        # The same smoke test as CI's wheel job, on the file that is uploaded
        run: |
          uv venv --python 3.14 /tmp/wheel
          uv pip install --python /tmp/wheel dist/*.whl
          test "$(/tmp/wheel/bin/vinospeak --print-text 'Hello from the wheel.')" = 'Hello from the wheel.'
          /tmp/wheel/bin/vinospeak-doctor

      - name: Check the metadata renders on PyPI
        # A rejected upload cannot be retried under the same version
        run: uvx twine@7.0.0 check --strict dist/*

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHANGELOG.md is hand-edited, so it is the source of release prose
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1              { found = 1; next }
            found && index($0, "## [") == 1  { exit }
            found                            { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            exit 1
          fi
          {
            echo
            echo '## Install'
            echo
            echo '```'
            echo "uv tool install --python 3.14 vinospeak==${VERSION}"
            echo '```'
          } >> RELEASE_NOTES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            RELEASE_NOTES.md

  pypi:
    needs: [ci, build]
    # Belt and braces: only a pushed v* tag may publish, whatever triggers are added later.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Named in PyPI's Trusted Publishing config; renaming it breaks uploads
    environment:
      name: pypi
      url: https://pypi.org/p/vinospeak
    permissions:
      id-token: write # OIDC for Trusted Publishing. No API token anywhere.
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist

      # Before the GitHub Release: a PyPI version can never be re-uploaded
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [build, gui, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      # Only on GitHub: PyPI gets dist/ as the build job left it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
      - run: cp src/install.sh dist/install.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so gh cannot infer the repo
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
