name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# The dev group only: no job here has OpenVINO or an NPU, so the tests cover
# everything that does not touch the model (CONTRIBUTING.md).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv venv
      - run: uv pip install --group dev
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install --group dev
      # numpy is imported by the tests; everything else is faked.
      - run: uv pip install numpy
      - run: .venv/bin/python -m pytest --cov=vino_speak --cov-report=term-missing
